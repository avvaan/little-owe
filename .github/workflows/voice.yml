name: Voice

# Records the content pack with the narrator voice and commits the clips.
#
# Six hundred generations is not something to drive by hand, and it is not something to
# start over when the network blinks at number four hundred - so the script is resumable
# and this only ever asks it for what is still missing. Run it as many times as you like.
#
# Needs one secret: ELEVENLABS_API_KEY.
on:
  workflow_dispatch:
    inputs:
      only:
        # Not "leave it empty for everything": an input with a default that is
        # dispatched as an empty string comes through as the default, so an empty box
        # quietly means "phrase,set" rather than "all of it". List what you want.
        description: "Which lines, as comma-separated prefixes. All of them: phrase,set,story,game,question"
        required: false
        default: "phrase,set,story,game,question"
      limit:
        description: "Stop after this many clips. 0 means no limit."
        required: false
        default: "0"
      language:
        description: "Which content pack"
        required: false
        default: "en"
      from_run:
        description: "Recover the clips from this run ID before recording, instead of paying to generate them again. Leave blank normally."
        required: false
        default: ""

concurrency:
  group: voice
  cancel-in-progress: false

permissions:
  contents: write
  # Reading another run's artifacts, which is how `from_run` recovers clips that were
  # generated but never committed.
  actions: read

jobs:
  record:
    name: Record and commit
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Require the key
        env:
          KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Missing repository secret ELEVENLABS_API_KEY"
            exit 1
          fi

      # Thirty-four thousand credits were spent generating clips that a failed commit
      # then threw away. The clips outlive the runner in the artifact, so recovering them
      # costs nothing - and because the script skips anything already on disk, dropping
      # them here means the run commits them and generates only what is genuinely
      # missing. One artifact per run, so take whatever is there rather than guessing its
      # name.
      - name: Recover clips from an earlier run
        if: inputs.from_run != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.from_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: content/${{ inputs.language }}/audio

      - name: Say what was recovered
        if: inputs.from_run != ''
        run: |
          count=$(find "content/${{ inputs.language }}/audio" -type f -name '*.mp3' | wc -l | tr -d ' ')
          echo "recovered $count clip(s) from run ${{ inputs.from_run }}"

      # Always, even when nothing will be generated: the cost lands in the log where
      # somebody can see it before the bill does.
      - name: What this run would cost
        run: |
          python3 tools/generate_voice.py \
            --language "${{ inputs.language }}" \
            --only "${{ inputs.only }}" \
            --dry-run

      - name: Record
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 tools/generate_voice.py \
            --language "${{ inputs.language }}" \
            --only "${{ inputs.only }}" \
            --limit "${{ inputs.limit }}"

      - name: Commit whatever was recorded
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `git status --porcelain`, not `git diff`. Every clip is a file that did not
          # exist before, and `git diff` does not look at untracked files - so the first
          # run that actually recorded anything reported "nothing new to commit",
          # exited 0, and threw away fifty-four clips with the runner.
          # -uall, or git collapses a wholly untracked directory into the single line
          # "?? content/en/audio/" and the commit message says it recorded one line when
          # it recorded fifty-four.
          changes=$(git status --porcelain -uall -- "content/${{ inputs.language }}/audio")
          if [ -z "$changes" ]; then
            echo "nothing new to commit"
            exit 0
          fi

          count=$(printf '%s\n' "$changes" | wc -l | tr -d ' ')
          echo "committing $count file(s)"
          git add "content/${{ inputs.language }}/audio"
          git commit -m "Record ${count} more lines of content/${{ inputs.language }}

          Generated by .github/workflows/voice.yml from the content pack itself, so the
          list of clips cannot drift from what the app looks for. The app falls back to
          the speech synthesiser per line rather than per build, so a half-recorded pack
          plays what exists and speaks the rest."

          # Runs on whatever branch it was dispatched on, which is the choice made at
          # dispatch time rather than one baked in here.
          #
          # Recording the whole pack takes twelve minutes, which is long enough for
          # somebody to push to the same branch meanwhile - and that is exactly what
          # happened, so a straight push failed and took the clips with it. Rebase onto
          # whatever is there now and try again.
          branch="${{ github.ref_name }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            echo "push rejected; rebasing onto origin/$branch (attempt $attempt)"
            git fetch origin "$branch"
            # Only this job's commit is being replayed, and it only adds files, so there
            # is nothing here for a conflict to be about.
            git rebase "origin/$branch"
          done
          echo "::error::Could not push after three attempts. The clips are in this run's artifact; recover them with the from_run input rather than recording them again."
          exit 1

      # The failure above was silent, which is what made it expensive: the run went
      # green, the log said "nothing new to commit", and the clips were gone. Recorded
      # clips that are not in the branch is now a failure with a name.
      - name: Every clip that was recorded is in the branch
        run: |
          on_disk=$(find "content/${{ inputs.language }}/audio" -type f \
                      \( -name '*.mp3' -o -name '*.m4a' -o -name '*.caf' -o -name '*.wav' \) \
                      2>/dev/null | wc -l | tr -d ' ')
          tracked=$(git ls-files "content/${{ inputs.language }}/audio" | wc -l | tr -d ' ')
          echo "$on_disk on disk, $tracked tracked"
          if [ "$on_disk" -ne "$tracked" ]; then
            echo "::error::$on_disk clips were recorded but $tracked are in the branch. They are in the run artifact; do not re-record before working out why."
            exit 1
          fi

      - name: Keep the clips as an artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-${{ inputs.language }}-${{ github.run_number }}
          path: content/${{ inputs.language }}/audio
          retention-days: 14
          if-no-files-found: ignore
