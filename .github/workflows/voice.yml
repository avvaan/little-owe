name: Voice

# Records the content pack with the narrator voice and commits the clips.
#
# Six hundred generations is not something to drive by hand, and it is not something to
# start over when the network blinks at number four hundred - so the script is resumable
# and this only ever asks it for what is still missing. Run it as many times as you like.
#
# Needs one secret: ELEVENLABS_API_KEY.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Which lines: comma-separated prefixes (phrase,set,story,game,question). Empty means everything still missing."
        required: false
        default: "phrase,set"
      limit:
        description: "Stop after this many clips. 0 means no limit."
        required: false
        default: "0"
      language:
        description: "Which content pack"
        required: false
        default: "en"

concurrency:
  group: voice
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    name: Record and commit
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Require the key
        env:
          KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Missing repository secret ELEVENLABS_API_KEY"
            exit 1
          fi

      # Always, even when nothing will be generated: the cost lands in the log where
      # somebody can see it before the bill does.
      - name: What this run would cost
        run: |
          python3 tools/generate_voice.py \
            --language "${{ inputs.language }}" \
            --only "${{ inputs.only }}" \
            --dry-run

      - name: Record
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 tools/generate_voice.py \
            --language "${{ inputs.language }}" \
            --only "${{ inputs.only }}" \
            --limit "${{ inputs.limit }}"

      - name: Commit whatever was recorded
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- "content/${{ inputs.language }}/audio"; then
            echo "nothing new to commit"
            exit 0
          fi

          count=$(git status --porcelain -- "content/${{ inputs.language }}/audio" | wc -l | tr -d ' ')
          git add "content/${{ inputs.language }}/audio"
          git commit -m "Record ${count} more lines of content/${{ inputs.language }}

          Generated by .github/workflows/voice.yml from the content pack itself, so the
          list of clips cannot drift from what the app looks for. The app falls back to
          the speech synthesiser per line rather than per build, so a half-recorded pack
          plays what exists and speaks the rest."

          # Runs on whatever branch it was dispatched on, which is the choice made at
          # dispatch time rather than one baked in here.
          git push origin HEAD:"${{ github.ref_name }}"

      - name: Keep the clips as an artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-${{ inputs.language }}-${{ github.run_number }}
          path: content/${{ inputs.language }}/audio
          retention-days: 14
          if-no-files-found: ignore
