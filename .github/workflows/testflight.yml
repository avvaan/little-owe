name: TestFlight

# Archives, signs and uploads a build to TestFlight.
#
# Signing uses an App Store Connect API key rather than a checked-in certificate and
# provisioning profile: with `-allowProvisioningUpdates` Xcode fetches or creates what
# it needs, which is three secrets instead of seven and nothing sensitive to rotate by
# hand. See docs/RELEASE.md for how to create the key.
#
# Run it from the Actions tab (Run workflow), or push a tag like v0.1.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What testers should look at in this build"
        required: false
        default: ""
  push:
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 45

    env:
      BUNDLE_ID: com.syrkin.littleowl

    steps:
      - uses: actions/checkout@v4

      # App Store Connect refuses anything built with an older SDK, and the runner
      # image defaults to whatever Xcode it shipped with - 16.4 as of the run that
      # caught this, which is the iOS 18.5 SDK. Pick the newest Xcode actually
      # installed rather than pinning a version that will age out of the image.
      - name: Use the newest Xcode on the runner
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version

          sdk=$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9.]*\).*/\1/p' | sort -V | tail -1)
          echo "newest iOS SDK on this runner: ${sdk:-none}"
          if [ "${sdk%%.*}" -lt 26 ] 2>/dev/null || [ -z "$sdk" ]; then
            echo "::error::This runner's newest iOS SDK is ${sdk:-none}. App Store Connect requires 26 or later. Installed Xcodes:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi

      - name: Require the signing secrets
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -z "$KEY_ID" ]     && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$ISSUER_ID" ]  && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$PRIVATE_KEY" ] && missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          [ -z "$TEAM_ID" ]    && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see docs/RELEASE.md"
            exit 1
          fi

      - name: Install the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # altool and xcodebuild both look here by convention.
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          printf '%s' "$PRIVATE_KEY" > ~/.private_keys/AuthKey_${KEY_ID}.p8
          cp ~/.private_keys/AuthKey_${KEY_ID}.p8 ~/.appstoreconnect/private_keys/
          chmod 600 ~/.private_keys/AuthKey_${KEY_ID}.p8

      - name: Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project LittleOwl.xcodeproj \
            -scheme LittleOwl \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LittleOwl.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Write the export options
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

      - name: Export the IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/LittleOwl.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls -la build/ipa

      - name: Validate before uploading
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --validate-app \
            -f build/ipa/LittleOwl.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f build/ipa/LittleOwl.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Keep the archive and IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LittleOwl-${{ github.run_number }}
          path: |
            build/ipa/*.ipa
            build/LittleOwl.xcarchive
          retention-days: 14
          if-no-files-found: warn
