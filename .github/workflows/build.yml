name: Build

# The compile check and the unit tests. Runs on every push and pull request and needs
# no secrets, no certificates and no Apple account — just a macOS runner with Xcode.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # App Store Connect refuses anything built with an older SDK, and the runner
      # image defaults to whatever Xcode it shipped with - 16.4 as of the run that
      # caught this, which is the iOS 18.5 SDK. Pick the newest Xcode actually
      # installed rather than pinning a version that will age out of the image.
      - name: Use the newest Xcode on the runner
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version

          sdk=$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9.]*\).*/\1/p' | sort -V | tail -1)
          echo "newest iOS SDK on this runner: ${sdk:-none}"
          if [ "${sdk%%.*}" -lt 26 ] 2>/dev/null || [ -z "$sdk" ]; then
            echo "::error::This runner's newest iOS SDK is ${sdk:-none}. App Store Connect requires 26 or later. Installed Xcodes:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          swift --version

      # Named simulators come and go between Xcode releases, so ask the runner what it
      # actually has rather than hard-coding a device that will vanish.
      - name: Pick an iPad simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' not in runtime:
                  continue
              for device in devices[runtime]:
                  if device.get('isAvailable') and 'iPad' in device['name']:
                      print(device['udid'] + ' ' + device['name'])
                      sys.exit()
          ")
          if [ -z "$UDID" ]; then
            echo '::error::No iPad simulator on this runner'
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using ${UDID#* } (${UDID%% *})"
          echo "udid=${UDID%% *}" >> "$GITHUB_OUTPUT"

      # No signing: this proves the code compiles and the tests pass, which is the only
      # thing this workflow is for. Signing belongs to the TestFlight workflow.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project LittleOwl.xcodeproj \
            -scheme LittleOwl \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .build \
            -resultBundlePath .build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # LITTLE_OWL_AI is off in every build that ships, so nothing above this compiles
      # the code behind it - and code that is never compiled stops compiling. This is a
      # build, not a test run: the flagged code is one networking type, one keychain
      # wrapper and one settings section, and what would rot about them is whether they
      # still build against the rest of the app.
      - name: Build the optional brain too, so it cannot rot
        run: |
          set -o pipefail
          xcodebuild build \
            -project LittleOwl.xcodeproj \
            -scheme LittleOwl \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .build-ai \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) LITTLE_OWL_AI'

      - name: Keep the test results when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .build/TestResults.xcresult
          retention-days: 7

      - name: Check the shipped art is what the export script produces
        run: |
          # The runner's Python is Homebrew-managed, so a system-wide pip install is
          # refused (PEP 668). A throwaway venv is the supported way in.
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check Pillow numpy
          # Compares pixels rather than bytes: a Pillow upgrade re-encodes the same
          # image differently, and that is not a reason to fail the build.
          .venv/bin/python tools/export_art.py --check

      - name: Check the turn detector still behaves
        run: python3 tools/simulate_turn_detection.py

      # Apple enforces these limits one field at a time, at submission, after a form has
      # been filled in - so a subtitle one character too long costs a round trip.
      - name: Check the App Store listing fits Apple's field limits
        run: python3 tools/check_metadata.py
