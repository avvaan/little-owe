# A spare key for the Xcode project.
#
# The committed LittleOwl.xcodeproj is the source of truth: it is hand-written, it is
# what CI builds, and it is what opens with a double-click. This file exists so that a
# project file mangled by a merge can be rebuilt rather than repaired:
#
#     brew install xcodegen && xcodegen generate
#
# **It has never been round-tripped.** Nothing in CI regenerates from it, so if you do,
# diff the result against what was there before rather than trusting it — in particular
# the shared scheme, which XcodeGen writes differently.
#
# XcodeGen is a build-time convenience only — it ships nothing into the app, so the
# "no third-party SDKs" rule is untouched.

name: LittleOwl
options:
  bundleIdPrefix: com.syrkin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"        # iPad only
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  LittleOwl:
    type: application
    platform: iOS
    sources:
      - path: LittleOwl
      # A folder reference, not a group: the content packs are read by path at runtime,
      # so content/<language>/ has to survive into the bundle with its shape intact.
      - path: content
        type: folder
    settings:
      base:
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.syrkin.littleowl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"

  LittleOwlTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LittleOwlTests
    dependencies:
      # XcodeGen derives TEST_HOST and BUNDLE_LOADER from this, which is what lets the
      # tests run inside the app and read the content pack out of Bundle.main.
      - target: LittleOwl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syrkin.littleowl.Tests
        GENERATE_INFOPLIST_FILE: YES
